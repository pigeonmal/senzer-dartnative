<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="100%" height="100%" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; border-radius:16px; border:1px solid #1e293b;">
  <defs>
    <!-- Background subtle mesh/glow -->
    <radialGradient id="cardGlow" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="1"/>
    </radialGradient>

    <!-- Store Gradients -->
    <linearGradient id="senzerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="rnGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="hiveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="sqliteGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>

    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="960" height="760" rx="16" fill="url(#cardGlow)"/>

  <!-- Header -->
  <g transform="translate(40, 44)">
    <text x="0" y="0" fill="#ffffff" font-size="22" font-weight="800" letter-spacing="-0.02em">Storage Benchmark: Xiaomi Pad 6</text>
    <text x="0" y="24" fill="#94a3b8" font-size="13">1,000 operations · Release mode (Android 14, arm64-v8a) · Median of 7 rounds</text>
    
    <!-- Badges in top right -->
    <g transform="translate(620, -14)">
      <rect x="0" y="0" width="260" height="34" rx="17" fill="#022c22" stroke="#059669" stroke-width="1.2"/>
      <circle cx="16" cy="17" r="4" fill="#34d399"/>
      <text x="28" y="21" fill="#34d399" font-size="12" font-weight="700">senzer_mmkv: Up to 5.3x faster</text>
    </g>
  </g>

  <!-- Clean Legend Bar -->
  <g transform="translate(40, 94)">
    <rect x="0" y="0" width="880" height="42" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    
    <g transform="translate(24, 25)">
      <!-- senzer_mmkv -->
      <rect x="0" y="-8" width="12" height="12" rx="3" fill="url(#senzerGrad)"/>
      <text x="20" y="2" fill="#ffffff" font-size="13" font-weight="700">senzer_mmkv</text>

      <!-- react-native-mmkv -->
      <rect x="200" y="-8" width="12" height="12" rx="3" fill="url(#rnGrad)"/>
      <text x="220" y="2" fill="#cbd5e1" font-size="13" font-weight="500">react-native-mmkv</text>

      <!-- dartnative_hive -->
      <rect x="440" y="-8" width="12" height="12" rx="3" fill="url(#hiveGrad)"/>
      <text x="460" y="2" fill="#cbd5e1" font-size="13" font-weight="500">dartnative_hive</text>

      <!-- dartnative_sqlite -->
      <rect x="650" y="-8" width="12" height="12" rx="3" fill="url(#sqliteGrad)"/>
      <text x="670" y="2" fill="#cbd5e1" font-size="13" font-weight="500">dartnative_sqlite</text>
    </g>
  </g>

  <!-- ================= CARD 1: WRITE OPERATIONS (Persistent Storage) ================= -->
  <g transform="translate(40, 156)">
    <!-- Container Box -->
    <rect x="0" y="0" width="880" height="268" rx="14" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Title -->
    <text x="24" y="32" fill="#38bdf8" font-size="14" font-weight="700" letter-spacing="0.04em">WRITE THROUGHPUT &amp; TIME (1,000 OPS)</text>
    <text x="350" y="32" fill="#64748b" font-size="12">Lower time / higher throughput is better</text>

    <!-- Grid lines (0 to 140 ms scale: 380px available -> ~2.7px per ms) -->
    <!-- Max = 140 ms -->
    <g transform="translate(230, 48)">
      <line x1="0" y1="0" x2="0" y2="190" stroke="#1e293b" stroke-width="1"/>
      <line x1="125" y1="0" x2="125" y2="190" stroke="#131e33" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="250" y1="0" x2="250" y2="190" stroke="#131e33" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="375" y1="0" x2="375" y2="190" stroke="#131e33" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="0" y="206" fill="#475569" font-size="10" text-anchor="middle">0 ms</text>
      <text x="125" y="206" fill="#475569" font-size="10" text-anchor="middle">50 ms</text>
      <text x="250" y="206" fill="#475569" font-size="10" text-anchor="middle">100 ms</text>
      <text x="375" y="206" fill="#475569" font-size="10" text-anchor="middle">150 ms</text>
    </g>

    <!-- 1. String Write -->
    <g transform="translate(24, 60)">
      <text x="190" y="36" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="end">String Write</text>

      <!-- senzer: 0.808 ms -> min 6px -->
      <rect x="206" y="8" width="8" height="11" rx="3" fill="url(#senzerGrad)" filter="url(#emeraldGlow)"/>
      <text x="222" y="18" fill="#34d399" font-size="11" font-weight="700">0.808 ms <tspan fill="#94a3b8" font-weight="400">· 1,237,624 ops/s</tspan></text>
      <rect x="520" y="6" width="75" height="16" rx="8" fill="#064e3b"/>
      <text x="557" y="18" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">2.0x vs RN</text>

      <!-- RN: 1.637 ms -> 12px -->
      <rect x="206" y="23" width="12" height="11" rx="3" fill="url(#rnGrad)"/>
      <text x="226" y="33" fill="#60a5fa" font-size="11" font-weight="500">1.637 ms <tspan fill="#94a3b8" font-weight="400">· 610,920 ops/s</tspan></text>

      <!-- Hive: 87.05 ms -> 217px -->
      <rect x="206" y="38" width="217" height="11" rx="3" fill="url(#hiveGrad)"/>
      <text x="432" y="48" fill="#fbbf24" font-size="11" font-weight="500">87.05 ms <tspan fill="#94a3b8" font-weight="400">· 11,488 ops/s (108x slower)</tspan></text>

      <!-- SQLite: 135.80 ms -> 339px -->
      <rect x="206" y="53" width="339" height="11" rx="3" fill="url(#sqliteGrad)"/>
      <text x="554" y="63" fill="#f87171" font-size="11" font-weight="500">135.80 ms <tspan fill="#94a3b8" font-weight="400">· 7,364 ops/s (168x slower)</tspan></text>
    </g>

    <line x1="24" y1="150" x2="856" y2="150" stroke="#162138" stroke-width="1"/>

    <!-- 2. Buffer Write 256B -->
    <g transform="translate(24, 162)">
      <text x="190" y="36" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="end">Buffer Write (256B)</text>

      <!-- senzer: 0.817 ms -->
      <rect x="206" y="8" width="8" height="11" rx="3" fill="url(#senzerGrad)" filter="url(#emeraldGlow)"/>
      <text x="222" y="18" fill="#34d399" font-size="11" font-weight="700">0.817 ms <tspan fill="#94a3b8" font-weight="400">· 1,223,990 ops/s</tspan></text>
      <rect x="520" y="6" width="75" height="16" rx="8" fill="#064e3b"/>
      <text x="557" y="18" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">2.8x vs RN</text>

      <!-- RN: 2.262 ms -->
      <rect x="206" y="23" width="14" height="11" rx="3" fill="url(#rnGrad)"/>
      <text x="228" y="33" fill="#60a5fa" font-size="11" font-weight="500">2.262 ms <tspan fill="#94a3b8" font-weight="400">· 442,009 ops/s</tspan></text>

      <!-- Hive: 75.03 ms -> 187px -->
      <rect x="206" y="38" width="187" height="11" rx="3" fill="url(#hiveGrad)"/>
      <text x="402" y="48" fill="#fbbf24" font-size="11" font-weight="500">75.03 ms <tspan fill="#94a3b8" font-weight="400">· 13,328 ops/s (92x slower)</tspan></text>

      <!-- SQLite: 129.42 ms -> 323px -->
      <rect x="206" y="53" width="323" height="11" rx="3" fill="url(#sqliteGrad)"/>
      <text x="538" y="63" fill="#f87171" font-size="11" font-weight="500">129.42 ms <tspan fill="#94a3b8" font-weight="400">· 7,727 ops/s (158x slower)</tspan></text>
    </g>
  </g>

  <!-- ================= CARD 2: READ OPERATIONS (Memory-Mapped & Cached) ================= -->
  <g transform="translate(40, 444)">
    <!-- Container Box -->
    <rect x="0" y="0" width="880" height="280" rx="14" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Title -->
    <text x="24" y="32" fill="#38bdf8" font-size="14" font-weight="700" letter-spacing="0.04em">READ LATENCY (1,000 OPS)</text>
    <text x="240" y="32" fill="#64748b" font-size="12">Direct memory-mapped access vs SQLite query execution</text>

    <!-- SQLite Callout on right -->
    <g transform="translate(670, 16)">
      <rect x="0" y="0" width="186" height="26" rx="6" fill="#1f151b" stroke="#7f1d1d" stroke-width="1"/>
      <text x="93" y="17" fill="#f87171" font-size="11" font-weight="600" text-anchor="middle">SQLite Reads: 128 - 175 ms</text>
    </g>

    <!-- Scale: 0 to 1.5 ms -> 380px (253px per ms) -->
    <g transform="translate(230, 48)">
      <line x1="0" y1="0" x2="0" y2="200" stroke="#1e293b" stroke-width="1"/>
      <line x1="126" y1="0" x2="126" y2="200" stroke="#131e33" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="253" y1="0" x2="253" y2="200" stroke="#131e33" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="380" y1="0" x2="380" y2="200" stroke="#131e33" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="0" y="216" fill="#475569" font-size="10" text-anchor="middle">0 ms</text>
      <text x="126" y="216" fill="#475569" font-size="10" text-anchor="middle">0.5 ms</text>
      <text x="253" y="216" fill="#475569" font-size="10" text-anchor="middle">1.0 ms</text>
      <text x="380" y="216" fill="#475569" font-size="10" text-anchor="middle">1.5 ms</text>
    </g>

    <!-- 1. String Read -->
    <g transform="translate(24, 60)">
      <text x="190" y="21" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="end">String Read</text>
      <!-- senzer: 0.259 ms -> 65px -->
      <rect x="206" y="2" width="65" height="10" rx="3" fill="url(#senzerGrad)" filter="url(#emeraldGlow)"/>
      <text x="278" y="11" fill="#34d399" font-size="11" font-weight="700">0.259 ms</text>
      <!-- RN: 0.639 ms -> 162px -->
      <rect x="206" y="15" width="162" height="10" rx="3" fill="url(#rnGrad)"/>
      <text x="375" y="24" fill="#60a5fa" font-size="11" font-weight="500">0.639 ms</text>
      <!-- Hive: 0.191 ms -> 48px -->
      <rect x="206" y="28" width="48" height="10" rx="3" fill="url(#hiveGrad)"/>
      <text x="261" y="37" fill="#fbbf24" font-size="11" font-weight="500">0.191 ms</text>
      <!-- Speedup badge -->
      <rect x="690" y="12" width="145" height="20" rx="10" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="762" y="26" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">2.5x vs RN (675x SQLite)</text>
    </g>

    <!-- 2. Number Read -->
    <g transform="translate(24, 110)">
      <text x="190" y="21" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="end">Number Read</text>
      <!-- senzer: 0.164 ms -> 41px -->
      <rect x="206" y="2" width="41" height="10" rx="3" fill="url(#senzerGrad)" filter="url(#emeraldGlow)"/>
      <text x="254" y="11" fill="#34d399" font-size="11" font-weight="700">0.164 ms</text>
      <!-- RN: 0.429 ms -> 108px -->
      <rect x="206" y="15" width="108" height="10" rx="3" fill="url(#rnGrad)"/>
      <text x="321" y="24" fill="#60a5fa" font-size="11" font-weight="500">0.429 ms</text>
      <!-- Hive: 0.328 ms -> 83px -->
      <rect x="206" y="28" width="83" height="10" rx="3" fill="url(#hiveGrad)"/>
      <text x="296" y="37" fill="#fbbf24" font-size="11" font-weight="500">0.328 ms</text>
      <!-- Speedup badge -->
      <rect x="690" y="12" width="145" height="20" rx="10" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="762" y="26" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">2.6x vs RN (920x SQLite)</text>
    </g>

    <!-- 3. Boolean Read -->
    <g transform="translate(24, 160)">
      <text x="190" y="21" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="end">Boolean Read</text>
      <!-- senzer: 0.119 ms -> 30px -->
      <rect x="206" y="2" width="30" height="10" rx="3" fill="url(#senzerGrad)" filter="url(#emeraldGlow)"/>
      <text x="243" y="11" fill="#34d399" font-size="11" font-weight="700">0.119 ms</text>
      <!-- RN: 0.313 ms -> 79px -->
      <rect x="206" y="15" width="79" height="10" rx="3" fill="url(#rnGrad)"/>
      <text x="292" y="24" fill="#60a5fa" font-size="11" font-weight="500">0.313 ms</text>
      <!-- Hive: 0.245 ms -> 62px -->
      <rect x="206" y="28" width="62" height="10" rx="3" fill="url(#hiveGrad)"/>
      <text x="275" y="37" fill="#fbbf24" font-size="11" font-weight="500">0.245 ms</text>
      <!-- Speedup badge -->
      <rect x="690" y="12" width="145" height="20" rx="10" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="762" y="26" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">2.6x vs RN (1,076x SQLite)</text>
    </g>

    <!-- 4. Buffer Read 256B -->
    <g transform="translate(24, 210)">
      <text x="190" y="21" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="end">Buffer Read 256B</text>
      <!-- senzer: 0.248 ms -> 63px -->
      <rect x="206" y="2" width="63" height="10" rx="3" fill="url(#senzerGrad)" filter="url(#emeraldGlow)"/>
      <text x="276" y="11" fill="#34d399" font-size="11" font-weight="700">0.248 ms</text>
      <!-- RN: 1.325 ms -> 335px -->
      <rect x="206" y="15" width="335" height="10" rx="3" fill="url(#rnGrad)"/>
      <text x="548" y="24" fill="#60a5fa" font-size="11" font-weight="500">1.325 ms</text>
      <!-- Hive: 0.256 ms -> 65px -->
      <rect x="206" y="28" width="65" height="10" rx="3" fill="url(#hiveGrad)"/>
      <text x="278" y="37" fill="#fbbf24" font-size="11" font-weight="500">0.256 ms</text>
      <!-- Speedup badge -->
      <rect x="690" y="12" width="145" height="20" rx="10" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="762" y="26" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">5.3x vs RN (526x SQLite)</text>
    </g>
  </g>
</svg>
