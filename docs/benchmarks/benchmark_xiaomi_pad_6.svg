<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%" style="background:#0d1117; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; border-radius:12px; border:1px solid #30363d;">
  <defs>
    <linearGradient id="senzerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="rnGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="36" y="42" fill="#f0f6fc" font-size="18" font-weight="700" letter-spacing="-0.01em">Android Xiaomi Pad 6 Benchmark (1,000 operations)</text>
  <text x="36" y="66" fill="#8b949e" font-size="12">Lower is better · Release mode (Android 14, arm64-v8a) · Median elapsed time in milliseconds</text>

  <!-- Legend -->
  <g transform="translate(560, 32)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="url(#senzerGrad)"/>
    <text x="20" y="12" fill="#f0f6fc" font-size="12" font-weight="600">senzer_mmkv</text>
    
    <rect x="135" y="0" width="14" height="14" rx="3" fill="url(#rnGrad)"/>
    <text x="155" y="12" fill="#8b949e" font-size="12" font-weight="500">react-native-mmkv</text>
  </g>

  <!-- Divider -->
  <line x1="36" y1="84" x2="844" y2="84" stroke="#21262d" stroke-width="1"/>

  <!-- Operations scale: 0 to 2.5 ms, width = 450px -> 180px per ms -->
  <!-- Axis Grid Lines (at 0.5ms, 1.0ms, 1.5ms, 2.0ms, 2.5ms) -->
  <g transform="translate(240, 0)">
    <!-- 0 ms -->
    <line x1="0" y1="96" x2="0" y2="450" stroke="#30363d" stroke-width="1"/>
    <text x="0" y="470" fill="#484f58" font-size="11" text-anchor="middle">0 ms</text>

    <!-- 0.5 ms -->
    <line x1="90" y1="96" x2="90" y2="450" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="90" y="470" fill="#484f58" font-size="11" text-anchor="middle">0.5 ms</text>

    <!-- 1.0 ms -->
    <line x1="180" y1="96" x2="180" y2="450" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="180" y="470" fill="#484f58" font-size="11" text-anchor="middle">1.0 ms</text>

    <!-- 1.5 ms -->
    <line x1="270" y1="96" x2="270" y2="450" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="270" y="470" fill="#484f58" font-size="11" text-anchor="middle">1.5 ms</text>

    <!-- 2.0 ms -->
    <line x1="360" y1="96" x2="360" y2="450" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="360" y="470" fill="#484f58" font-size="11" text-anchor="middle">2.0 ms</text>

    <!-- 2.5 ms -->
    <line x1="450" y1="96" x2="450" y2="450" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="450" y="470" fill="#484f58" font-size="11" text-anchor="middle">2.5 ms</text>
  </g>

  <!-- Items list (8 operations, spacing = 43px) -->
  
  <!-- 1. String Read (0.259 ms vs 0.639 ms) -->
  <g transform="translate(36, 102)">
    <text x="190" y="21" fill="#c9d1d9" font-size="13" font-weight="500" text-anchor="end">String Read</text>
    <!-- senzer bar (0.259 * 180 = 46.6px) -->
    <rect x="204" y="6" width="47" height="12" rx="3" fill="url(#senzerGrad)" filter="url(#glow)"/>
    <text x="257" y="16" fill="#34d399" font-size="11" font-weight="600">0.259 ms</text>
    <!-- RN bar (0.639 * 180 = 115.0px) -->
    <rect x="204" y="22" width="115" height="12" rx="3" fill="url(#rnGrad)"/>
    <text x="325" y="32" fill="#8b949e" font-size="11">0.639 ms</text>
    <!-- Speedup pill -->
    <rect x="710" y="10" width="85" height="20" rx="10" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="752" y="24" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">2.47x faster</text>
  </g>

  <!-- 2. String Write (0.808 ms vs 1.637 ms) -->
  <g transform="translate(36, 145)">
    <text x="190" y="21" fill="#c9d1d9" font-size="13" font-weight="500" text-anchor="end">String Write</text>
    <!-- senzer bar (0.808 * 180 = 145.4px) -->
    <rect x="204" y="6" width="145" height="12" rx="3" fill="url(#senzerGrad)" filter="url(#glow)"/>
    <text x="355" y="16" fill="#34d399" font-size="11" font-weight="600">0.808 ms</text>
    <!-- RN bar (1.637 * 180 = 294.7px) -->
    <rect x="204" y="22" width="295" height="12" rx="3" fill="url(#rnGrad)"/>
    <text x="505" y="32" fill="#8b949e" font-size="11">1.637 ms</text>
    <!-- Speedup pill -->
    <rect x="710" y="10" width="85" height="20" rx="10" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="752" y="24" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">2.03x faster</text>
  </g>

  <!-- 3. Number Read (0.164 ms vs 0.429 ms) -->
  <g transform="translate(36, 188)">
    <text x="190" y="21" fill="#c9d1d9" font-size="13" font-weight="500" text-anchor="end">Number Read</text>
    <!-- senzer bar (0.164 * 180 = 29.5px) -->
    <rect x="204" y="6" width="30" height="12" rx="3" fill="url(#senzerGrad)" filter="url(#glow)"/>
    <text x="240" y="16" fill="#34d399" font-size="11" font-weight="600">0.164 ms</text>
    <!-- RN bar (0.429 * 180 = 77.2px) -->
    <rect x="204" y="22" width="77" height="12" rx="3" fill="url(#rnGrad)"/>
    <text x="287" y="32" fill="#8b949e" font-size="11">0.429 ms</text>
    <!-- Speedup pill -->
    <rect x="710" y="10" width="85" height="20" rx="10" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="752" y="24" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">2.62x faster</text>
  </g>

  <!-- 4. Number Write (0.770 ms vs 1.464 ms) -->
  <g transform="translate(36, 231)">
    <text x="190" y="21" fill="#c9d1d9" font-size="13" font-weight="500" text-anchor="end">Number Write</text>
    <!-- senzer bar (0.770 * 180 = 138.6px) -->
    <rect x="204" y="6" width="139" height="12" rx="3" fill="url(#senzerGrad)" filter="url(#glow)"/>
    <text x="349" y="16" fill="#34d399" font-size="11" font-weight="600">0.770 ms</text>
    <!-- RN bar (1.464 * 180 = 263.5px) -->
    <rect x="204" y="22" width="264" height="12" rx="3" fill="url(#rnGrad)"/>
    <text x="474" y="32" fill="#8b949e" font-size="11">1.464 ms</text>
    <!-- Speedup pill -->
    <rect x="710" y="10" width="85" height="20" rx="10" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="752" y="24" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">1.90x faster</text>
  </g>

  <!-- 5. Boolean Read (0.119 ms vs 0.313 ms) -->
  <g transform="translate(36, 274)">
    <text x="190" y="21" fill="#c9d1d9" font-size="13" font-weight="500" text-anchor="end">Boolean Read</text>
    <!-- senzer bar (0.119 * 180 = 21.4px) -->
    <rect x="204" y="6" width="22" height="12" rx="3" fill="url(#senzerGrad)" filter="url(#glow)"/>
    <text x="232" y="16" fill="#34d399" font-size="11" font-weight="600">0.119 ms</text>
    <!-- RN bar (0.313 * 180 = 56.3px) -->
    <rect x="204" y="22" width="56" height="12" rx="3" fill="url(#rnGrad)"/>
    <text x="266" y="32" fill="#8b949e" font-size="11">0.313 ms</text>
    <!-- Speedup pill -->
    <rect x="710" y="10" width="85" height="20" rx="10" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="752" y="24" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">2.63x faster</text>
  </g>

  <!-- 6. Boolean Write (0.761 ms vs 1.662 ms) -->
  <g transform="translate(36, 317)">
    <text x="190" y="21" fill="#c9d1d9" font-size="13" font-weight="500" text-anchor="end">Boolean Write</text>
    <!-- senzer bar (0.761 * 180 = 137.0px) -->
    <rect x="204" y="6" width="137" height="12" rx="3" fill="url(#senzerGrad)" filter="url(#glow)"/>
    <text x="347" y="16" fill="#34d399" font-size="11" font-weight="600">0.761 ms</text>
    <!-- RN bar (1.662 * 180 = 299.2px) -->
    <rect x="204" y="22" width="299" height="12" rx="3" fill="url(#rnGrad)"/>
    <text x="509" y="32" fill="#8b949e" font-size="11">1.662 ms</text>
    <!-- Speedup pill -->
    <rect x="710" y="10" width="85" height="20" rx="10" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="752" y="24" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">2.18x faster</text>
  </g>

  <!-- 7. Buffer Read 256B (0.248 ms vs 1.325 ms) -->
  <g transform="translate(36, 360)">
    <text x="190" y="21" fill="#c9d1d9" font-size="13" font-weight="500" text-anchor="end">Buffer Read (256B)</text>
    <!-- senzer bar (0.248 * 180 = 44.6px) -->
    <rect x="204" y="6" width="45" height="12" rx="3" fill="url(#senzerGrad)" filter="url(#glow)"/>
    <text x="255" y="16" fill="#34d399" font-size="11" font-weight="600">0.248 ms</text>
    <!-- RN bar (1.325 * 180 = 238.5px) -->
    <rect x="204" y="22" width="239" height="12" rx="3" fill="url(#rnGrad)"/>
    <text x="449" y="32" fill="#8b949e" font-size="11">1.325 ms</text>
    <!-- Speedup pill -->
    <rect x="710" y="10" width="85" height="20" rx="10" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="752" y="24" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">5.34x faster</text>
  </g>

  <!-- 8. Buffer Write 256B (0.817 ms vs 2.262 ms) -->
  <g transform="translate(36, 403)">
    <text x="190" y="21" fill="#c9d1d9" font-size="13" font-weight="500" text-anchor="end">Buffer Write (256B)</text>
    <!-- senzer bar (0.817 * 180 = 147.1px) -->
    <rect x="204" y="6" width="147" height="12" rx="3" fill="url(#senzerGrad)" filter="url(#glow)"/>
    <text x="357" y="16" fill="#34d399" font-size="11" font-weight="600">0.817 ms</text>
    <!-- RN bar (2.262 * 180 = 407.2px) -->
    <rect x="204" y="22" width="407" height="12" rx="3" fill="url(#rnGrad)"/>
    <text x="617" y="32" fill="#8b949e" font-size="11">2.262 ms</text>
    <!-- Speedup pill -->
    <rect x="710" y="10" width="85" height="20" rx="10" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="752" y="24" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">2.77x faster</text>
  </g>
</svg>
