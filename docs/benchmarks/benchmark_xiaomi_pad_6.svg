<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%" style="background:#0d1117; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; border-radius:12px; border:1px solid #30363d;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="senzerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="rnGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="hiveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="sqliteGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f87171" />
    </linearGradient>

    <!-- Glow for senzer -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="36" y="38" fill="#f0f6fc" font-size="18" font-weight="700" letter-spacing="-0.01em">Android Xiaomi Pad 6 Storage Benchmark</text>
  <text x="36" y="58" fill="#8b949e" font-size="12">1,000 operations · Release mode (Android 14, arm64-v8a) · Lower elapsed time is better</text>

  <!-- Legend -->
  <g transform="translate(36, 76)">
    <!-- senzer_mmkv -->
    <rect x="0" y="0" width="12" height="12" rx="3" fill="url(#senzerGrad)"/>
    <text x="18" y="10" fill="#f0f6fc" font-size="12" font-weight="600">senzer_mmkv</text>

    <!-- react-native-mmkv -->
    <rect x="145" y="0" width="12" height="12" rx="3" fill="url(#rnGrad)"/>
    <text x="163" y="10" fill="#c9d1d9" font-size="12" font-weight="500">react-native-mmkv</text>

    <!-- dartnative_hive -->
    <rect x="330" y="0" width="12" height="12" rx="3" fill="url(#hiveGrad)"/>
    <text x="348" y="10" fill="#c9d1d9" font-size="12" font-weight="500">dartnative_hive</text>

    <!-- dartnative_sqlite -->
    <rect x="495" y="0" width="12" height="12" rx="3" fill="url(#sqliteGrad)"/>
    <text x="513" y="10" fill="#c9d1d9" font-size="12" font-weight="500">dartnative_sqlite</text>
  </g>

  <!-- Divider -->
  <line x1="36" y1="102" x2="884" y2="102" stroke="#21262d" stroke-width="1"/>

  <!-- ================= SECTION 1: READ BENCHMARKS (Low Latency < 1ms, SQLite in 100ms) ================= -->
  <g transform="translate(36, 118)">
    <text x="0" y="14" fill="#58a6ff" font-size="13" font-weight="700" letter-spacing="0.05em">READ LATENCY (1,000 OPS)</text>
    <text x="215" y="14" fill="#8b949e" font-size="11">Fast memory-mapped &amp; cached reads (ms)</text>

    <!-- Grid lines for Read Scale: 0 to 1.5 ms, width = 450px -> 300px per ms -->
    <g transform="translate(210, 20)">
      <line x1="0" y1="0" x2="0" y2="200" stroke="#30363d" stroke-width="1"/>
      <text x="0" y="214" fill="#484f58" font-size="10" text-anchor="middle">0 ms</text>

      <line x1="150" y1="0" x2="150" y2="200" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="150" y="214" fill="#484f58" font-size="10" text-anchor="middle">0.5 ms</text>

      <line x1="300" y1="0" x2="300" y2="200" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="300" y="214" fill="#484f58" font-size="10" text-anchor="middle">1.0 ms</text>

      <line x1="450" y1="0" x2="450" y2="200" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="450" y="214" fill="#484f58" font-size="10" text-anchor="middle">1.5 ms</text>
    </g>

    <!-- 1. String Read -->
    <!-- senzer: 0.259 (78px), RN: 0.639 (192px), Hive: 0.191 (57px), SQLite: 174.8 ms (off chart) -->
    <g transform="translate(0, 24)">
      <text x="195" y="17" fill="#f0f6fc" font-size="12" font-weight="600" text-anchor="end">String Read</text>
      <!-- Bars: 210 is origin -->
      <!-- senzer -->
      <rect x="210" y="2" width="78" height="7" rx="2" fill="url(#senzerGrad)" filter="url(#glow)"/>
      <text x="294" y="9" fill="#34d399" font-size="10" font-weight="700">0.259 ms</text>
      <!-- RN -->
      <rect x="210" y="12" width="192" height="7" rx="2" fill="url(#rnGrad)"/>
      <text x="408" y="19" fill="#8b949e" font-size="10">0.639 ms</text>
      <!-- Hive -->
      <rect x="210" y="22" width="57" height="7" rx="2" fill="url(#hiveGrad)"/>
      <text x="273" y="29" fill="#e3b341" font-size="10">0.191 ms</text>
      <!-- SQLite Tag -->
      <rect x="680" y="8" width="168" height="18" rx="4" fill="#21262d"/>
      <text x="688" y="21" fill="#f87171" font-size="10">SQLite: 174.8 ms (675x)</text>
    </g>

    <!-- 2. Number Read -->
    <!-- senzer: 0.164 (49px), RN: 0.429 (129px), Hive: 0.328 (98px), SQLite: 150.8 ms -->
    <g transform="translate(0, 72)">
      <text x="195" y="17" fill="#f0f6fc" font-size="12" font-weight="600" text-anchor="end">Number Read</text>
      <rect x="210" y="2" width="49" height="7" rx="2" fill="url(#senzerGrad)" filter="url(#glow)"/>
      <text x="265" y="9" fill="#34d399" font-size="10" font-weight="700">0.164 ms</text>
      <rect x="210" y="12" width="129" height="7" rx="2" fill="url(#rnGrad)"/>
      <text x="345" y="19" fill="#8b949e" font-size="10">0.429 ms</text>
      <rect x="210" y="22" width="98" height="7" rx="2" fill="url(#hiveGrad)"/>
      <text x="314" y="29" fill="#e3b341" font-size="10">0.328 ms</text>
      <rect x="680" y="8" width="168" height="18" rx="4" fill="#21262d"/>
      <text x="688" y="21" fill="#f87171" font-size="10">SQLite: 150.8 ms (920x)</text>
    </g>

    <!-- 3. Boolean Read -->
    <!-- senzer: 0.119 (36px), RN: 0.313 (94px), Hive: 0.245 (74px), SQLite: 128.0 ms -->
    <g transform="translate(0, 120)">
      <text x="195" y="17" fill="#f0f6fc" font-size="12" font-weight="600" text-anchor="end">Boolean Read</text>
      <rect x="210" y="2" width="36" height="7" rx="2" fill="url(#senzerGrad)" filter="url(#glow)"/>
      <text x="252" y="9" fill="#34d399" font-size="10" font-weight="700">0.119 ms</text>
      <rect x="210" y="12" width="94" height="7" rx="2" fill="url(#rnGrad)"/>
      <text x="310" y="19" fill="#8b949e" font-size="10">0.313 ms</text>
      <rect x="210" y="22" width="74" height="7" rx="2" fill="url(#hiveGrad)"/>
      <text x="290" y="29" fill="#e3b341" font-size="10">0.245 ms</text>
      <rect x="680" y="8" width="168" height="18" rx="4" fill="#21262d"/>
      <text x="688" y="21" fill="#f87171" font-size="10">SQLite: 128.0 ms (1,076x)</text>
    </g>

    <!-- 4. Buffer Read 256B -->
    <!-- senzer: 0.248 (74px), RN: 1.325 (398px), Hive: 0.256 (77px), SQLite: 130.5 ms -->
    <g transform="translate(0, 168)">
      <text x="195" y="17" fill="#f0f6fc" font-size="12" font-weight="600" text-anchor="end">Buffer Read 256B</text>
      <rect x="210" y="2" width="74" height="7" rx="2" fill="url(#senzerGrad)" filter="url(#glow)"/>
      <text x="290" y="9" fill="#34d399" font-size="10" font-weight="700">0.248 ms</text>
      <rect x="210" y="12" width="398" height="7" rx="2" fill="url(#rnGrad)"/>
      <text x="614" y="19" fill="#8b949e" font-size="10">1.325 ms (5.3x)</text>
      <rect x="210" y="22" width="77" height="7" rx="2" fill="url(#hiveGrad)"/>
      <text x="293" y="29" fill="#e3b341" font-size="10">0.256 ms</text>
      <rect x="680" y="8" width="168" height="18" rx="4" fill="#21262d"/>
      <text x="688" y="21" fill="#f87171" font-size="10">SQLite: 130.5 ms (526x)</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="36" y1="364" x2="884" y2="364" stroke="#21262d" stroke-width="1"/>

  <!-- ================= SECTION 2: WRITE BENCHMARKS (Persistent Writes) ================= -->
  <!-- We show all 4 stores on a log-scaled / normalized comparison bar to showcase the massive difference -->
  <g transform="translate(36, 380)">
    <text x="0" y="14" fill="#58a6ff" font-size="13" font-weight="700" letter-spacing="0.05em">WRITE LATENCY &amp; THROUGHPUT (1,000 OPS)</text>
    <text x="310" y="14" fill="#8b949e" font-size="11">MMKV mmap (sub-millisecond) vs Disk/DB files (ms)</text>

    <!-- Operations: String Write & Buffer Write 256B with all 4 stores -->
    
    <!-- String Write -->
    <g transform="translate(0, 30)">
      <text x="195" y="17" fill="#f0f6fc" font-size="12" font-weight="600" text-anchor="end">String Write</text>
      
      <!-- senzer: 0.808 ms · 1.24M ops/s (width scale: max SQLite = 140ms -> map across 470px) -->
      <!-- Visual representation using direct comparison bars -->
      <g transform="translate(210, 0)">
        <!-- senzer_mmkv -->
        <rect x="0" y="0" width="12" height="10" rx="2" fill="url(#senzerGrad)" filter="url(#glow)"/>
        <text x="18" y="9" fill="#34d399" font-size="11" font-weight="700">0.808 ms <tspan fill="#8b949e" font-weight="400">(1,237,624 ops/s)</tspan></text>
        <rect x="330" y="-1" width="84" height="14" rx="7" fill="#064e3b"/>
        <text x="372" y="10" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">2.03x vs RN</text>

        <!-- react-native-mmkv -->
        <rect x="0" y="14" width="24" height="10" rx="2" fill="url(#rnGrad)"/>
        <text x="30" y="23" fill="#60a5fa" font-size="11" font-weight="600">1.637 ms <tspan fill="#8b949e" font-weight="400">(610,920 ops/s)</tspan></text>

        <!-- dartnative_hive -->
        <rect x="0" y="28" width="280" height="10" rx="2" fill="url(#hiveGrad)"/>
        <text x="288" y="37" fill="#fbbf24" font-size="11" font-weight="600">87.05 ms <tspan fill="#8b949e" font-weight="400">(11,488 ops/s · 108x slower)</tspan></text>

        <!-- dartnative_sqlite -->
        <rect x="0" y="42" width="440" height="10" rx="2" fill="url(#sqliteGrad)"/>
        <text x="448" y="51" fill="#f87171" font-size="11" font-weight="600">135.80 ms <tspan fill="#8b949e" font-weight="400">(7,364 ops/s · 168x slower)</tspan></text>
      </g>
    </g>

    <!-- Buffer Write 256B -->
    <g transform="translate(0, 110)">
      <text x="195" y="17" fill="#f0f6fc" font-size="12" font-weight="600" text-anchor="end">Buffer Write 256B</text>
      
      <g transform="translate(210, 0)">
        <!-- senzer_mmkv -->
        <rect x="0" y="0" width="12" height="10" rx="2" fill="url(#senzerGrad)" filter="url(#glow)"/>
        <text x="18" y="9" fill="#34d399" font-size="11" font-weight="700">0.817 ms <tspan fill="#8b949e" font-weight="400">(1,223,990 ops/s)</tspan></text>
        <rect x="330" y="-1" width="84" height="14" rx="7" fill="#064e3b"/>
        <text x="372" y="10" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">2.77x vs RN</text>

        <!-- react-native-mmkv -->
        <rect x="0" y="14" width="33" height="10" rx="2" fill="url(#rnGrad)"/>
        <text x="40" y="23" fill="#60a5fa" font-size="11" font-weight="600">2.262 ms <tspan fill="#8b949e" font-weight="400">(442,009 ops/s)</tspan></text>

        <!-- dartnative_hive -->
        <rect x="0" y="28" width="245" height="10" rx="2" fill="url(#hiveGrad)"/>
        <text x="253" y="37" fill="#fbbf24" font-size="11" font-weight="600">75.03 ms <tspan fill="#8b949e" font-weight="400">(13,328 ops/s · 92x slower)</tspan></text>

        <!-- dartnative_sqlite -->
        <rect x="0" y="42" width="420" height="10" rx="2" fill="url(#sqliteGrad)"/>
        <text x="428" y="51" fill="#f87171" font-size="11" font-weight="600">129.42 ms <tspan fill="#8b949e" font-weight="400">(7,727 ops/s · 158x slower)</tspan></text>
      </g>
    </g>
  </g>
</svg>
