name: senzer_mmkv
description: A synchronous, C++-backed MMKV-compatible key-value store for DartNative.
version: 0.1.0
homepage: https://github.com/pigeonmal/senzer-dartnative
repository: https://github.com/pigeonmal/senzer-dartnative
issue_tracker: https://github.com/pigeonmal/senzer-dartnative/issues
topics:
  - dartnative
  - mmkv
  - storage
  - ffi
  - cpp

environment:
  sdk: ^3.12.0-192.0.dev

dependencies:
  dartnative: ^1.0.0
  ffi: ^2.1.4

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

dartnative:
  plugin:
    platforms:
      ios:
        ffiPlugin: true
      android:
        package: com.senzer.mmkv
        pluginClass: SenzerMmkvPlugin
  registrant:
    imports:
      - package:senzer_mmkv/senzer_mmkv.dart
    calls:
      - SenzerMMKVBindings.loadSymbols();
