buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath 'com.android.tools.build:gradle:8.11.1'
    classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20'
  }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
  namespace 'com.senzer.mmkv'
  compileSdk 36
  buildFeatures { prefab true }

  defaultConfig {
    minSdk 23
    consumerProguardFiles 'consumer-rules.pro'
    externalNativeBuild {
      cmake {
        cppFlags '-std=c++20 -fexceptions -frtti -Wall -fstack-protector-strong'
        arguments '-DANDROID_STL=c++_shared', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
      }
    }
  }

  externalNativeBuild { cmake { path 'CMakeLists.txt' } }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions { jvmTarget = '17' }
}

// The DartNative app/toolchain supplies the FlutterPlugin API. This package
// intentionally has no monorepo-only framework dependency, so it remains
// publishable and usable from dn plugin build.
dependencies {
  implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.20'
  implementation 'io.github.zhongwuzw:mmkv:2.4.2'
}
